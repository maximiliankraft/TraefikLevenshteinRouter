name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

stages:
  - test

levenshtein-router-test:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    GO_VERSION: "1.22"
  before_script:
    - apk add --no-cache go git curl docker-cli-compose
  script:
    - docker compose up -d --build
    - docker compose ps
    - sleep 1
    - go test -v ./...
  after_script:
    - docker compose logs
    - docker compose down -v
