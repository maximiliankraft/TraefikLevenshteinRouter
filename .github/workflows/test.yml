name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  levenshtein-router-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Start test stack
        run: docker compose -f test/compose.yml up -d --build

      - name: Show test stack
        run: docker compose -f test/compose.yml ps

      - name: Wait for test stack
        run: sleep 1

      - name: Run Go tests
        run: go test -v ./...

      - name: Show test stack logs
        if: ${{ always() }}
        run: docker compose -f test/compose.yml logs

      - name: Stop test stack
        if: ${{ always() }}
        run: docker compose -f test/compose.yml down -v
